# /etc/configProyecto.conf
# Copia este archivo a /etc y ajusta AllowedClientIP a la IP o red VPN del
# cliente. No publiques el puerto 2306 directamente en Internet.

ListenIP=0.0.0.0
Port=2306
AllowedClientIP=127.0.0.1
MaxAuthAttempts=3
UsersFile=/etc/configProyecto.users
DefaultReportPeriodSeconds=5
MaxReportPeriodSeconds=60

# Log persistente. El servicio crea /var/log/proyecto-operativos con
# LogsDirectory= y el servidor rota el archivo al superar LogMaxSizeMB.
LogFile=/var/log/proyecto-operativos/servidor.log
LogMaxSizeMB=10
LogBackups=5
