# Configuración de ejemplo para ejecutar desde la raíz del repositorio.
# En producción se usa /etc/configProyecto.conf (ver deploy/).
ListenIP=0.0.0.0
Port=2306
AllowedClientIP=100.66.232.76
MaxAuthAttempts=3
UsersFile=users.conf
DefaultReportPeriodSeconds=5
MaxReportPeriodSeconds=60
# Log de desarrollo junto a este archivo; se crea solo y rota por tamaño.
LogFile=servidor.log
LogMaxSizeMB=10
LogBackups=3
